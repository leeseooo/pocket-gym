<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Frog Gym</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: transparent;
    font-family: "Menlo", monospace;
    overflow: hidden;
    user-select: none; -webkit-user-select: none;
    cursor: default;
  }
  #panel {
    position: relative; width: 100vw; height: 100vh;
    background: #23232b; border-radius: 12px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.06);
    overflow: hidden; display: flex; flex-direction: column;
  }
  #panel::before {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(120% 80% at 50% 0%, rgba(255,255,255,.06), transparent 60%);
    pointer-events: none; z-index: 3;
  }
  /* 상단 바 = 드래그 핸들 */
  #bar {
    height: 26px; flex: 0 0 26px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 6px 0 8px; z-index: 5; gap: 6px;
    text-shadow: 0 1px 0 rgba(0,0,0,.6);
  }
  #left { display: flex; align-items: center; gap: 5px; min-width: 0; }
  #back {
    width: 18px; height: 18px; border: none; border-radius: 4px;
    background: rgba(255,255,255,.06); color: #b8b8c2;
    font-size: 12px; line-height: 1; cursor: pointer; padding: 0; display: none;
  }
  #back:hover { background: rgba(255,255,255,.16); color: #fff; }
  #stat1 { font-size: 11px; color: #ffd23f; font-weight: bold; letter-spacing: .5px; white-space: nowrap; }
  #stat1 .n { font-size: 15px; }
  #stat1.title { color: #e8e8ec; letter-spacing: 2px; }
  #stat1.pop { animation: pop .18s ease-out; }
  @keyframes pop { 0% { transform: scale(1.5); } 100% { transform: scale(1); } }
  #stat2 { font-size: 10px; color: #8a8a99; white-space: nowrap; }
  #right { display: flex; align-items: center; gap: 6px; }
  #close {
    width: 16px; height: 16px; border: none; border-radius: 4px;
    background: rgba(255,255,255,.06); color: #9a9aa2;
    font-size: 12px; line-height: 1; cursor: pointer; padding: 0;
  }
  #close:hover { background: #e23b3b; color: #fff; }

  /* 메인 메뉴 — 마리오풍 볼드 2x2 */
  #menu {
    flex: 1 1 auto; display: grid;
    grid-template-columns: 1fr 1fr; grid-auto-rows: 1fr;
    gap: 8px; padding: 9px; z-index: 2;
  }
  .card {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
    border-radius: 12px; border: 3px solid rgba(0,0,0,.5);
    box-shadow: 0 5px 0 rgba(0,0,0,.4), inset 0 2px 0 rgba(255,255,255,.28);
    cursor: pointer; transition: transform .06s, box-shadow .06s, filter .1s;
  }
  .card:hover { filter: brightness(1.08); }
  .card:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,.4), inset 0 2px 0 rgba(255,255,255,.28); }
  .card .emoji { font-size: 32px; filter: drop-shadow(0 2px 0 rgba(0,0,0,.35)); }
  .card .name { font-size: 12px; color: #fff; font-weight: 900; letter-spacing: 1px; text-shadow: 1.5px 1.5px 0 rgba(0,0,0,.55); }
  .card[data-game="combobag"] { background: #e52521; }
  .card[data-game="unbroken"] { background: #049cd8; }
  .card[data-game="rings"] { background: #43b047; }
  .card.soon { background: #4a4a55; cursor: default; opacity: .7; box-shadow: 0 5px 0 rgba(0,0,0,.4), inset 0 2px 0 rgba(255,255,255,.08); }
  .card.soon:hover { filter: none; }
  .card.soon:active { transform: none; box-shadow: 0 5px 0 rgba(0,0,0,.4), inset 0 2px 0 rgba(255,255,255,.08); }
  .card.soon .emoji { filter: grayscale(1) opacity(.7); }

  /* 게임 스테이지 */
  #stage { position: relative; flex: 1 1 auto; cursor: pointer; display: none; }
  #stage.grab { cursor: grab; }
  canvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
    image-rendering: pixelated; image-rendering: crisp-edges;
  }
  #hint {
    position: absolute; bottom: 6px; left: 0; right: 0;
    text-align: center; font-size: 9px; color: #6a6a76; z-index: 4;
    pointer-events: none; text-shadow: 0 1px 0 rgba(0,0,0,.6);
  }
</style>
</head>
<body>
  <div id="panel">
    <div id="bar" data-tauri-drag-region>
      <div id="left">
        <button id="back" title="메뉴">◀</button>
        <div id="stat1" class="title">FROG GYM</div>
        <div id="stat2"></div>
      </div>
      <div id="right">
        <button id="close" title="닫기">×</button>
      </div>
    </div>

    <div id="menu">
      <div class="card" data-game="combobag"><div class="emoji">🥊</div><div class="name">COMBO BAG</div></div>
      <div class="card" data-game="unbroken"><div class="emoji">🏋️</div><div class="name">UNBROKEN</div></div>
      <div class="card" data-game="rings"><div class="emoji">💍</div><div class="name">SHAKY RINGS</div></div>
      <div class="card soon"><div class="emoji">❓</div><div class="name">SOON</div></div>
    </div>

    <div id="stage">
      <canvas id="game"></canvas>
      <div id="hint"></div>
    </div>
  </div>

<script>
// ═══════════════ 공용 인프라 ═══════════════
const W = 96, H = 96, SCALE = 4;
const view = document.getElementById("game");
view.width = W * SCALE; view.height = H * SCALE;
const vctx = view.getContext("2d"); vctx.imageSmoothingEnabled = false;
const buf = document.createElement("canvas"); buf.width = W; buf.height = H;
const ctx = buf.getContext("2d");

function px(x, y, w, h, color) { ctx.fillStyle = color; ctx.fillRect(x|0, y|0, w, h); }
function thickLine(x0, y0, x1, y1, thick, color) {
  const steps = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) | 0;
  for (let i = 0; i <= steps; i++) {
    const t = steps ? i / steps : 0;
    px(x0 + (x1 - x0) * t - thick / 2, y0 + (y1 - y0) * t - thick / 2, thick, thick, color);
  }
}
const easeOut = t => 1 - (1 - t) * (1 - t);
const easeIn  = t => t * t;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
function rgb(a, f) { return `rgb(${clamp(a[0]*f,0,255)|0},${clamp(a[1]*f,0,255)|0},${clamp(a[2]*f,0,255)|0})`; }

const OUTLINE = "#1c1c22";

// ── 3x5 도트 폰트 ──
const FONT = {
  " ":["...","...","...","...","..."], "!":[".#.",".#.",".#.","...",".#."],
  "%":["#.#","..#",".#.","#..","#.#"],
  P:["###","#.#","###","#..","#.."], E:["###","#..","###","#..","###"],
  R:["###","#.#","###","##.","#.#"], F:["###","#..","###","#..","#.."],
  C:["###","#..","#..","#..","###"], T:["###",".#.",".#.",".#.",".#."],
  G:[".##","#..","#.#","#.#",".##"], O:["###","#.#","#.#","#.#","###"],
  D:["##.","#.#","#.#","#.#","##."], A:["###","#.#","###","#.#","#.#"],
  L:["#..","#..","#..","#..","###"], Y:["#.#","#.#",".#.",".#.",".#."],
  N:["#.#","##.","#.#","#.#","#.#"], B:["##.","#.#","##.","#.#","##."],
  U:["#.#","#.#","#.#","#.#","###"], K:["#.#","##.","#..","##.","#.#"],
  W:["#.#","#.#","#.#","###","#.#"], H:["#.#","#.#","###","#.#","#.#"],
  M:["#.#","###","###","#.#","#.#"], S:[".##","#..",".#.","..#","##."],
  I:["###",".#.",".#.",".#.","###"], X:["#.#","#.#",".#.","#.#","#.#"],
};
function drawText(text, cx, top, scale, color) {
  const cw = 3 * scale, gap = scale;
  const total = text.length * cw + (text.length - 1) * gap;
  let x = Math.round(cx - total / 2);
  for (const ch of text.toUpperCase()) {
    const g = FONT[ch] || FONT[" "];
    for (let r = 0; r < 5; r++) for (let c = 0; c < 3; c++)
      if (g[r][c] === "#") px(x + c * scale, top + r * scale, scale, scale, color);
    x += cw + gap;
  }
}

// ── 오디오 ──
let audio;
function actx() { return audio = audio || new (window.AudioContext || window.webkitAudioContext)(); }
function tone(f1, f2, dur, vol, type = "sine") {
  try {
    const a = actx(), n = a.currentTime, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f1, n);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g).connect(a.destination); o.start(n); o.stop(n + dur + 0.02);
  } catch (e) {}
}
function noise(dur, vol, hp) {
  try {
    const a = actx(), n = a.currentTime;
    const nb = a.createBuffer(1, a.sampleRate * dur, a.sampleRate), d = nb.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    const ns = a.createBufferSource(); ns.buffer = nb;
    const g = a.createGain(); g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    const f = a.createBiquadFilter(); f.type = "highpass"; f.frequency.value = hp || 800;
    ns.connect(f).connect(g).connect(a.destination); ns.start(n); ns.stop(n + dur);
  } catch (e) {}
}

// ── HUD ──
const stat1El = document.getElementById("stat1");
const stat2El = document.getElementById("stat2");
function setStat1(html, { pop = false, title = false } = {}) {
  stat1El.innerHTML = html; stat1El.classList.toggle("title", title);
  if (pop) { stat1El.classList.remove("pop"); void stat1El.offsetWidth; stat1El.classList.add("pop"); }
}
function setStat2(t) { stat2El.textContent = t; }
function setHint(t) { document.getElementById("hint").textContent = t || ""; }

// ═══════════════ 캐릭터 ═══════════════
// 캐릭터: 피곤한 청개구리 하나로 고정 (두 게임 공통)
const CHARS = {
  frog: {
    ub:  { body: [122,200,72], limb: [110,185,64], eye: [250,250,250], pupil: [22,22,26], lid: [96,168,60], dark: [78,138,50] },
    box: { body: "#7ac846", bodyD: "#4f8a2e", trunk: "#e2b53b", trunkD: "#a8801f" },
  },
};
const CHAR = "frog";

// 공용 팔레트(도트 그림 안 쓰는 곳용)
const C = {
  glove: "#e23b3b", gloveD: "#a11f1f", boot: "#e8e8ec", bootD: "#9a9aa2",
  bag: "#e23b3b", bagD: "#a11f1f", bagL: "#f57070", chain: "#6a6a76",
  fx: "#fff3b0", fxHot: "#ffffff", hair: "#2b2b33",
  platform: "#3a3a46", platformD: "#2a2a33",
  good: "#8ce04a", perfect: "#ffd23f", bad: "#e2513b", track: "#33333d",
};

// ═══════════════ 게임 1: Combo Bag ═══════════════
function makeComboBag() {
  const PUNCHES = ["jab", "straight", "hook", "upper", "kick"];
  const DEF = {
    jab:      { dur: 260, hitAt: .42, reach: 26, ty: 44, arc: "straight", power: .7 },
    straight: { dur: 340, hitAt: .48, reach: 30, ty: 46, arc: "straight", power: 1.0 },
    hook:     { dur: 380, hitAt: .50, reach: 24, ty: 42, arc: "hook",     power: 1.1 },
    upper:    { dur: 360, hitAt: .52, reach: 22, ty: 40, arc: "upper",    power: 1.15 },
    kick:     { dur: 460, hitAt: .55, reach: 30, ty: 60, arc: "kick",     power: 1.3 },
  };
  const s = { punch: null, combo: 0, total: 0, lastHit: -9999, bagVel: 0, bagAng: 0, fx: [], time: 0 };
  let shake = 0;

  function hud() { setStat1(`<span class="n">${s.combo}</span> COMBO`, { pop: true }); setStat2(`🥊 ${s.total}`); }
  function onHit(def) {
    s.total++;
    if (s.time - s.lastHit < 1500) s.combo++; else s.combo = 1;
    s.lastHit = s.time; shake = 6 * def.power; s.bagVel += 0.055 * def.power;
    s.fx.push({ x: 52, y: def.ty, t: 0, life: 260, power: def.power });
    tone(def.arc === "kick" ? 90 : def.arc === "upper" ? 150 : 130, 50, 0.16, 0.5 * def.power);
    noise(0.08, 0.35 * def.power, 900); hud();
  }
  function fistPos(p, prog) {
    const def = p.def, gx = 34, gy = 40, hx = 34 + def.reach, hy = def.ty;
    let ex = prog < def.hitAt ? easeOut(prog / def.hitAt) : 1 - easeIn((prog - def.hitAt) / (1 - def.hitAt));
    let x = gx + (hx - gx) * ex, y = gy + (hy - gy) * ex;
    if (def.arc === "hook")  { x += Math.sin(ex * Math.PI) * 6; y -= Math.sin(ex * Math.PI) * 8; }
    if (def.arc === "upper") y += Math.sin(ex * Math.PI) * 10;
    return { x, y, ex };
  }
  function drawHead(x, y) {
    // 피곤한 청개구리 (스내치 게임 얼굴과 톤 통일)
    const cc = CHARS.frog.box;
    px(x - 1, y + 2, 13, 10, cc.body);            // 넓적 얼굴
    px(x + 1, y - 3, 5, 5, cc.body); px(x + 6, y - 3, 5, 5, cc.body); // 눈두덩(툭)
    px(x + 2, y - 2, 3, 3, "#fafafa"); px(x + 7, y - 2, 3, 3, "#fafafa"); // 눈알
    px(x + 3, y, 2, 2, "#1a1a1e"); px(x + 8, y, 2, 2, "#1a1a1e");     // 처진 눈동자
    px(x + 1, y - 3, 5, 2, cc.bodyD); px(x + 6, y - 3, 5, 2, cc.bodyD); // 반쯤 감긴 눈꺼풀
    px(x + 2, y + 1, 3, 1, "#4f8a2e"); px(x + 7, y + 1, 3, 1, "#4f8a2e"); // 눈밑 다크서클
    px(x + 1, y + 8, 9, 1, cc.bodyD);             // 힘없는 입(직선)
  }
  function drawBoxer() {
    const cc = CHARS[CHAR].box;
    const prog = s.punch ? s.punch.t / s.punch.def.dur : 0;
    const kicking = s.punch && s.punch.def.arc === "kick";
    const breathe = Math.sin(s.time / 500) * 1;
    const baseY = s.punch ? -Math.sin(prog * Math.PI) * 1.5 : breathe;
    const cx = 22, feetY = 82;
    if (kicking) {
      const ex = prog < s.punch.def.hitAt ? easeOut(prog / s.punch.def.hitAt)
                                          : 1 - easeIn((prog - s.punch.def.hitAt) / (1 - s.punch.def.hitAt));
      px(cx - 4, feetY - 16, 5, 16, cc.trunkD);
      px(cx - 5, feetY - 2, 8, 3, C.bootD);
      px(cx + 2, 60 + baseY, ex * 22, 5, cc.body);
      px(cx + 2 + ex * 22, 58 + baseY + ex * 2, 7, 6, C.boot);
    } else {
      px(cx - 4, feetY - 16, 5, 16, cc.trunkD);
      px(cx + 2, feetY - 16, 5, 16, cc.trunk);
      px(cx - 5, feetY - 2, 8, 3, C.bootD);
      px(cx + 1, feetY - 2, 8, 3, C.boot);
    }
    px(cx - 5, 52 + baseY, 14, 12, cc.trunk);
    px(cx - 5, 60 + baseY, 14, 3, cc.trunkD);
    px(cx - 4, 38 + baseY, 12, 15, cc.body);
    px(cx - 4, 38 + baseY, 3, 15, cc.bodyD);
    px(cx + 5, 40 + baseY, 5, 8, cc.body);
    px(cx + 8, 36 + baseY, 7, 7, C.gloveD);
    drawHead(cx - 2, 26 + baseY);
    if (s.punch && !kicking) {
      const f = fistPos(s.punch, prog);
      thickLine(cx + 4, 42 + baseY, f.x, f.y, 4, cc.body);
      px(f.x, f.y - 4, 9, 9, C.glove);
      px(f.x, f.y + 2, 9, 3, C.gloveD);
      px(f.x + 1, f.y - 3, 3, 3, "#ff8a8a");
    } else if (!kicking) {
      px(cx + 6, 38 + baseY, 8, 8, C.glove);
      px(cx + 6, 44 + baseY, 8, 2, C.gloveD);
    }
  }
  function drawBag() {
    ctx.save(); ctx.translate(62, 14); ctx.rotate(s.bagAng);
    px(-1, -8, 2, 8, C.chain); px(-3, -8, 6, 3, C.chain);
    px(-9, 2, 18, 56, C.bag); px(-9, 2, 5, 56, C.bagD); px(4, 2, 3, 56, C.bagL);
    px(-9, 2, 18, 3, C.bagD); px(-9, 52, 18, 4, C.bagD); px(-9, 24, 18, 3, C.bagD);
    ctx.restore();
  }
  function drawFx() {
    for (const f of s.fx) {
      const p = f.t / f.life; if (p >= 1) continue;
      const r = (2 + p * 10) * (0.6 + f.power * 0.5);
      const cx = f.x + s.bagAng * 30, cy = f.y, col = p < 0.4 ? C.fxHot : C.fx;
      for (let a = 0; a < 8; a++) {
        const ang = (a / 8) * Math.PI * 2, len = r * (a % 2 ? 0.6 : 1), sz = Math.max(1, 3 - p * 3);
        px(cx + Math.cos(ang) * len - sz / 2, cy + Math.sin(ang) * len - sz / 2, sz, sz, col);
      }
    }
  }
  return {
    get shake() { return shake; },
    enter() { s.combo = 0; s.total = 0; s.lastHit = -9999; s.punch = null; s.fx = []; s.bagAng = 0; s.bagVel = 0; setHint("click to punch"); hud(); },
    onDown() { const t = PUNCHES[(Math.random() * PUNCHES.length) | 0]; s.punch = { type: t, t: 0, def: DEF[t] }; onHit(DEF[t]); },
    onMove() {}, onUp() {},
    update(dt) {
      s.time += dt;
      if (s.punch) { s.punch.t += dt; if (s.punch.t >= s.punch.def.dur) s.punch = null; }
      if (s.combo > 0 && s.time - s.lastHit > 1500) { s.combo = 0; hud(); }
      s.bagVel += -s.bagAng * 0.02; s.bagVel *= 0.94; s.bagAng += s.bagVel;
      shake *= 0.85; if (shake < 0.1) shake = 0;
      for (const f of s.fx) f.t += dt;
      s.fx = s.fx.filter(f => f.t < f.life);
    },
    render() {
      ctx.fillStyle = "rgba(0,0,0,.25)"; ctx.fillRect(10, 82, 32, 4); ctx.fillRect(52, 68, 22, 3);
      drawBag(); drawBoxer(); drawFx();
    },
  };
}

// ═══════════════ 게임 2: Unbroken (360° 회전 · B급 실패연출) ═══════════════
function makeUnbroken() {
  function disc(sx, sy, r, color) {
    sx = Math.round(sx); sy = Math.round(sy);
    for (let dy = -r; dy <= r; dy++) {
      const w = Math.sqrt(Math.max(0, r * r - dy * dy));
      px(sx - w, sy + dy, (2 * w + 1) | 0, 1, color);
    }
  }
  // 관절 포즈 (x=앞뒤+앞, y=위, 골반=원점)
  const POSE = {
    setup: { pelvis:[-2,0],  chest:[3,9],  head:[5,20], sho:[3,11], hand:[6,-22], knee:[7,-13], ankle:[0,-28] },
    hang:  { pelvis:[0,0],   chest:[1,11], head:[2,22], sho:[1,13], hand:[3,-6],  knee:[3,-14], ankle:[0,-28] },
    ext:   { pelvis:[0,2],   chest:[0,13], head:[0,24], sho:[0,15], hand:[1,2],   knee:[0,-13], ankle:[0,-30] },
    catch: { pelvis:[-1,-4], chest:[0,7],  head:[1,18], sho:[0,9],  hand:[1,30],  knee:[8,-14], ankle:[0,-28] },
    stand: { pelvis:[0,0],   chest:[0,12], head:[0,24], sho:[0,14], hand:[0,34],  knee:[0,-14], ankle:[0,-28] },
    // B급 실패: 뒤로 벌러덩
    fall:  { pelvis:[-4,-20],chest:[-11,-17],head:[-18,-13],sho:[-11,-16],hand:[-15,-19],knee:[6,-17],ankle:[14,-14] },
  };
  const JOINTS = ["pelvis","chest","head","sho","hand","knee","ankle"];
  const cur = {}; for (const j of JOINTS) cur[j] = [0, 0];
  const HIPZ = 5, SHOZ = 6, GRIPZ = 6, BARZ = 15;
  const FLOOR_BAR = [2, -26];   // 바닥에 떨어진 바벨 위치(모델)

  // 시점 고정: 옆에서 살짝 내려다보는 각도 (180cm가 150cm를 보듯)
  const YAW = 0.42, PITCH = -0.30;
  const s = {
    phase: "ready", t: 0, reps: 0, best: 0, perfects: 0, attempts: 0,
    hangDur: 900, cursor: 0, flash: null, time: 0,
    barHeld: true, bar: [6, -22], barPhys: null,
  };
  let target = POSE.setup, lerpSpeed = 0.18;
  const GOOD_LO = 0.34, PERF_LO = 0.5, PERF_HI = 0.68, GOOD_HI = 0.82;

  function hud() {
    setStat1(`<span class="n">${s.reps}</span> UNBROKEN`, { pop: true });
    const rate = s.attempts ? Math.round(s.perfects / s.attempts * 100) : 0;
    setStat2(`◎${rate}% ·${s.best}`);
  }
  function setPose(name, sp) { target = POSE[name]; if (sp != null) lerpSpeed = sp; }
  function flash(text, color) { s.flash = { text, color, t: 0 }; }
  function toPhase(p) { s.phase = p; s.t = 0; }

  function fail(reason) {
    s.attempts++; if (s.reps > s.best) s.best = s.reps; s.reps = 0;
    flash(reason, C.bad);
    tone(200, 60, 0.3, 0.5, "sawtooth"); noise(0.18, 0.45, 400);
    // 바벨 튕겨나감: 손 위치에서 랜덤 속도/스핀으로 발사
    const hp = project(cur.hand[0], cur.hand[1], 0);
    s.barPhys = {
      x: hp.sx, y: hp.sy,
      vx: (Math.random() * 2 - 1) * 6.5,
      vy: -3 - Math.random() * 4,
      ang: 0, va: (Math.random() * 2 - 1) * 0.8,
    };
    s.barHeld = false;
    toPhase("drop"); setPose("fall", 0.32);
    hud();
  }
  function success(quality) {
    s.attempts++; s.perfects += quality === "perfect" ? 1 : 0; s.reps++;
    if (s.reps > s.best) s.best = s.reps;
    flash(quality === "perfect" ? "PERFECT!" : "GOOD", quality === "perfect" ? C.perfect : C.good);
    tone(quality === "perfect" ? 520 : 420, 900, 0.12, 0.4, "square"); noise(0.06, 0.25, 1400);
    s.hangDur = Math.max(480, 900 - s.reps * 22);
    toPhase("pop"); setPose("ext", 0.5); hud();
  }
  function judgeRelease() {
    const c = s.cursor;
    if (c < GOOD_LO) return fail("EARLY");
    if (c > GOOD_HI) return fail("LATE");
    if (c >= PERF_LO && c <= PERF_HI) return success("perfect");
    return success("good");
  }

  // ── 투영 ──
  function project(mx, my, mz) {
    const cy = Math.cos(YAW), sy = Math.sin(YAW), cp = Math.cos(PITCH), sp = Math.sin(PITCH);
    const x = mx * cy + mz * sy, z = -mx * sy + mz * cy, y = my;
    const y2 = y * cp - z * sp, z2 = y * sp + z * cp;
    return { sx: 48 + x * 0.92, sy: 58 - y2 * 0.92, depth: z2, r0: 0.92 };
  }

  // ── 블롭 빌드 (캐릭터별) ──
  function bone(a, b, r, col, L, sp) {
    sp = sp || 1.7;   // 촘촘하게 → 매끈한 튜브(덜 꾸불꾸불)
    const dx = b[0]-a[0], dy = b[1]-a[1], dz = (b[2]||0)-(a[2]||0);
    const len = Math.hypot(dx, dy, dz), n = Math.max(1, Math.round(len / sp));
    for (let i = 0; i <= n; i++) { const t = i / n; L.push({ x:a[0]+dx*t, y:a[1]+dy*t, z:(a[2]||0)+dz*t, r, col }); }
  }
  function blob(x, y, z, r, col, L) { L.push({ x, y, z, r, col }); }

  function buildBlobs() {
    const cfg = CHARS[CHAR].ub, p = cur, L = [];
    const body = cfg.body, limb = cfg.limb;
    // 중앙축
    bone([p.pelvis[0],p.pelvis[1],0], [p.chest[0],p.chest[1],0], 4, body, L);
    bone([p.chest[0],p.chest[1],0], [p.head[0],p.head[1],0], 2.6, limb, L);
    blob(p.head[0], p.head[1], 0, 5, limb, L);
    // 팔다리
    for (const sd of [-1, 1]) {
      const hip=[p.pelvis[0],p.pelvis[1],sd*HIPZ], knee=[p.knee[0],p.knee[1],sd*HIPZ], ank=[p.ankle[0],p.ankle[1],sd*HIPZ];
      const sho=[p.sho[0],p.sho[1],sd*SHOZ], hand=[p.hand[0],p.hand[1],sd*GRIPZ];
      bone(hip, knee, 3.4, body, L);
      bone(knee, ank, 2.8, limb, L);
      blob(ank[0]+1.5, ank[1]-1, ank[2], 2.6, [70,74,90], L);   // 발
      bone([p.chest[0],p.chest[1],0], sho, 2.8, body, L);
      bone(sho, hand, 2.2, limb, L);
    }
    // 피곤한 개구리 얼굴
    charFeatures(cfg, p, L);
    // 바벨(양손 사이 or 바닥) — 튕기는 중(barPhys)엔 2D로 따로 그림
    if (!s.barPhys) {
      const bx = s.bar[0], by = s.bar[1];
      bone([bx,by,-BARZ], [bx,by,BARZ], 1.3, [205,208,218], L, 2.2);
      for (const sd of [-1,1]) { blob(bx, by, sd*BARZ, 6.5, [226,70,70], L); blob(bx, by, sd*(BARZ-1.6), 6.5, [226,70,70], L); }
    }
    return L;
  }
  function charFeatures(cfg, p, L) {
    for (const sd of [-1,1]) {
      blob(p.head[0]+1, p.head[1]+4, sd*3, 3, cfg.eye, L);          // 눈알
      blob(p.head[0]+3, p.head[1]+3, sd*3, 1.3, cfg.pupil, L);      // 처진 눈동자
      blob(p.head[0]+1.4, p.head[1]+5.4, sd*3, 2.6, cfg.lid, L);    // 반쯤 감은 눈꺼풀
      blob(p.head[0]+2, p.head[1]+1.6, sd*3, 1.3, cfg.dark, L);     // 눈밑 다크서클
    }
    blob(p.head[0]+3.4, p.head[1]+0.2, 0, 1.2, [50,92,38], L);      // 힘없는 입
  }

  function fillEllipse(cx, cy, rx, ry, color, alpha) {
    ctx.globalAlpha = alpha; ctx.fillStyle = color;
    for (let dy = -ry; dy <= ry; dy++) {
      const w = rx * Math.sqrt(Math.max(0, 1 - (dy*dy)/(ry*ry)));
      ctx.fillRect((cx - w)|0, (cy + dy)|0, (2*w)|0, 1);
    }
    ctx.globalAlpha = 1;
  }

  function drawLifter() {
    // 바닥 접지 그림자 (얕게)
    const fs = project(0, -27, 0);
    fillEllipse(fs.sx, 84, 15, 3, "#000", 0.22);
    const blobs = buildBlobs();
    for (const b of blobs) { const p = project(b.x, b.y, b.z); b.sx = p.sx; b.sy = p.sy; b.depth = p.depth; b.sr = b.r * 0.92; }
    blobs.sort((a, b) => a.depth - b.depth);
    // 2패스: 외곽선 먼저 전부 → 채움 전부 (내부 이음새 없이 매끈한 실루엣)
    for (const b of blobs) disc(b.sx, b.sy, b.sr + 0.9, OUTLINE);
    for (const b of blobs) disc(b.sx, b.sy, b.sr, rgb(b.col, b.depth > 0 ? 1.0 : 0.86));
  }
  function drawPlatform() {
    px(14, 84, 68, 4, C.platform); px(14, 88, 68, 3, C.platformD); px(14, 84, 68, 1, "#4a4a56");
  }
  function drawBounceBar() {
    const bp = s.barPhys; if (!bp) return;
    ctx.save();
    ctx.translate(Math.round(bp.x), Math.round(bp.y));
    ctx.rotate(bp.ang);
    ctx.fillStyle = OUTLINE;                                       // 외곽선(요소별)
    ctx.fillRect(-12, -2, 24, 4); ctx.fillRect(-13, -6, 6, 12); ctx.fillRect(7, -6, 6, 12);
    ctx.fillStyle = "#cdd0da"; ctx.fillRect(-11, -1, 22, 2);      // 봉
    ctx.fillStyle = "#e24646"; ctx.fillRect(-12, -5, 4, 10); ctx.fillRect(8, -5, 4, 10);  // 원판
    ctx.fillStyle = "#a11f1f"; ctx.fillRect(-12, -5, 1, 10); ctx.fillRect(11, -5, 1, 10);
    ctx.restore();
  }
  function drawMeter() {
    if (s.phase !== "pull" && s.phase !== "hang") return;
    const x0 = 24, x1 = 72, y = 92, w = x1 - x0;
    px(x0, y, w, 1, C.track);
    const tx = x0 + w * ((PERF_LO + PERF_HI) / 2);
    px(tx - 3, y - 1, 6, 1, C.perfect);
    if (s.phase === "hang") { const cxp = x0 + w * clamp(s.cursor, 0, 1); px(cxp - 1, y - 3, 2, 5, "#fff"); }
  }
  function drawFlash() {
    if (!s.flash) return;
    const p = s.flash.t / 650; if (p >= 1) { s.flash = null; return; }
    ctx.globalAlpha = 1 - p * p;
    drawText(s.flash.text, 48, 11 - p * 5, 2, s.flash.color);
    ctx.globalAlpha = 1;
  }
  function hint() {
    switch (s.phase) {
      case "ready": return "click & HOLD to lift";
      case "pull":  return "hold...";
      case "hang":  return "release on the mark!";
      case "drop": case "fallen": return "oof...";
      case "getup": return "getting up...";
      case "pickup": return "picking it up...";
      default: return "";
    }
  }

  return {
    shake: 0,
    enter() {
      s.phase = "ready"; s.t = 0; s.reps = 0; s.best = 0; s.perfects = 0; s.attempts = 0;
      s.hangDur = 900; s.cursor = 0; s.flash = null;
      s.barHeld = true; s.barPhys = null;
      for (const j of JOINTS) { cur[j][0] = POSE.setup[j][0]; cur[j][1] = POSE.setup[j][1]; }
      s.bar = [POSE.setup.hand[0], POSE.setup.hand[1]];
      target = POSE.setup; lerpSpeed = 0.18;
      setHint(hint()); hud();
    },
    onDown() {
      if (s.phase === "ready") { toPhase("pull"); setPose("hang", 0.16); tone(150, 90, 0.1, 0.25); noise(0.05, 0.15, 600); }
    },
    onMove() {},
    onUp() {
      if (s.phase === "pull") return fail("EARLY");
      if (s.phase === "hang") return judgeRelease();
    },
    update(dt) {
      s.time += dt; s.t += dt;
      if (s.flash) s.flash.t += dt;
      const k = 1 - Math.pow(1 - lerpSpeed, dt / 16.67);
      for (const j of JOINTS) { cur[j][0] = lerp(cur[j][0], target[j][0], k); cur[j][1] = lerp(cur[j][1], target[j][1], k); }
      // 바벨 위치: 잡고 있으면 손, 아니면 바닥
      const bt = s.barHeld ? cur.hand : FLOOR_BAR;
      s.bar[0] = lerp(s.bar[0], bt[0], 1 - Math.pow(1 - 0.2, dt / 16.67));
      s.bar[1] = lerp(s.bar[1], bt[1], 1 - Math.pow(1 - 0.2, dt / 16.67));

      // 튕기는 바벨 물리 (실패 연출)
      if (s.barPhys) {
        const bp = s.barPhys, FLOOR = 83;
        bp.vy += 0.34; bp.x += bp.vx; bp.y += bp.vy; bp.ang += bp.va;
        if (bp.y > FLOOR) {
          bp.y = FLOOR;
          if (bp.vy > 1.3) { tone(150, 70, 0.05, 0.22); noise(0.04, 0.3, 1100); }  // 쨍강
          bp.vy *= -0.5; bp.vx *= 0.8; bp.va *= 0.72;
          if (Math.abs(bp.vy) < 0.6) { bp.vy = 0; bp.va *= 0.5; }
        }
        if (bp.x < 18) { bp.x = 18; if (bp.vx < -1) noise(0.03, 0.2, 900); bp.vx = Math.abs(bp.vx) * 0.6; }
        if (bp.x > 78) { bp.x = 78; if (bp.vx > 1) noise(0.03, 0.2, 900); bp.vx = -Math.abs(bp.vx) * 0.6; }
      }

      if (s.phase === "pull") { if (s.t > 260) { toPhase("hang"); s.cursor = 0; } }
      else if (s.phase === "hang") { s.cursor += dt / s.hangDur; if (s.cursor >= 1) fail("LATE"); }
      else if (s.phase === "pop") {
        if (s.t > 110 && target === POSE.ext) { setPose("catch", 0.4); noise(0.05, 0.2, 1000); }
        if (s.t > 300 && target === POSE.catch) setPose("stand", 0.22);
        if (s.t > 620) toPhase("stand");
      }
      else if (s.phase === "stand") { if (s.t > 260) { toPhase("descend"); setPose("setup", 0.16); } }
      else if (s.phase === "descend") { if (s.t > 360) toPhase("ready"); }
      // ── B급 실패 → 복구 시퀀스 (바벨 주울 때까지 대기) ──
      else if (s.phase === "drop")   { if (s.t > 240) toPhase("fallen"); }
      else if (s.phase === "fallen") { if (s.t > 900) { toPhase("getup"); setPose("stand", 0.13); } }
      else if (s.phase === "getup")  { if (s.t > 540) { toPhase("pickup"); setPose("setup", 0.16); s.barPhys = null; s.barHeld = true; s.bar[0] = FLOOR_BAR[0]; s.bar[1] = FLOOR_BAR[1]; } }
      else if (s.phase === "pickup") { if (s.t > 440) toPhase("ready"); }
      setHint(hint());
    },
    render() { drawPlatform(); drawLifter(); drawBounceBar(); drawMeter(); drawFlash(); },
  };
}

// ═══════════════ 게임 3: Shaky Rings (링 머슬업 · 추적) ═══════════════
function makeRingMuscleUp() {
  const YAW = 1.05 + Math.PI, PITCH = -0.06, SC = 0.9, CX = 44, GROUND = 52;   // 개구리 뒤 1m(측면 나란히) → 등 뒤 3/4 시점
  const HIPZ = 4, SHOZ = 5;
  // 난이도 프리셋 (현재: 중)
  const DIFFS = {
    easy: { ampBase:0.085, ampK:0.03, frBase:1.1, frK:2.4, tolBase:0.14,  tolK:0.03,  fill:0.26, fillBonus:0.12, drain:0.12, endur:0.010, dartAmp:0.045, dartMin:650, dartRange:650, accUp:1.9,  accDn:1.3, startProg:0.22 },
    med:  { ampBase:0.115, ampK:0.04, frBase:1.6, frK:4.2, tolBase:0.105, tolK:0.03,  fill:0.22, fillBonus:0.12, drain:0.17, endur:0.018, dartAmp:0.075, dartMin:480, dartRange:560, accUp:1.85, accDn:1.4, startProg:0.18 },
    hard: { ampBase:0.16,  ampK:0.06, frBase:2.2, frK:7.0, tolBase:0.075, tolK:0.028, fill:0.15, fillBonus:0.12, drain:0.28, endur:0.040, dartAmp:0.14,  dartMin:320, dartRange:480, accUp:1.7,  accDn:1.5, startProg:0.06 },
  };
  const D = DIFFS.easy;
  const RING = [[CX - 11, 30], [CX + 11, 30]];   // 좌/우 링 화면 위치(고정)
  const white=[250,250,250], pupil=[22,22,26], lid=[96,168,60], dark=[78,138,50];
  const body=[122,200,72], limb=[110,185,64];

  function project(mx, my, mz) {
    const cy=Math.cos(YAW), sy=Math.sin(YAW), cp=Math.cos(PITCH), sp=Math.sin(PITCH);
    const x=mx*cy+mz*sy, z=-mx*sy+mz*cy, y=my;
    const y2=y*cp - z*sp, z2=y*sp + z*cp;
    return { sx: CX + x*SC, sy: GROUND - y2*SC, depth: z2 };
  }
  function disc(sx, sy, r, color) {
    sx=Math.round(sx); sy=Math.round(sy);
    for (let dy=-r; dy<=r; dy++){ const w=Math.sqrt(Math.max(0,r*r-dy*dy)); px(sx-w, sy+dy, (2*w+1)|0, 1, color); }
  }
  function bone(a, b, r, col, L, sp) {
    sp=sp||1.7; const dx=b[0]-a[0],dy=b[1]-a[1],dz=(b[2]||0)-(a[2]||0);
    const len=Math.hypot(dx,dy,dz), n=Math.max(1,Math.round(len/sp));
    for(let i=0;i<=n;i++){const t=i/n; L.push({x:a[0]+dx*t,y:a[1]+dy*t,z:(a[2]||0)+dz*t,r,col});}
  }
  function blob(x,y,z,r,col,L){ L.push({x,y,z,r,col}); }

  const J = ["pelvis","chest","head","sho","knee","ankle"];
  const P = {
    floor: { pelvis:[0,-18], chest:[0,-9], head:[0,-1], sho:[0,-6], knee:[6,-22], ankle:[2,-28] },
    hang:  { pelvis:[0,6],   chest:[0,15], head:[0,23], sho:[0,18], knee:[3,-6],  ankle:[1,-18] },
    kipF:  { pelvis:[3,6],   chest:[-1,15],head:[-2,23],sho:[0,18], knee:[9,-4],  ankle:[13,-14] },
    kipB:  { pelvis:[-3,6],  chest:[3,15], head:[4,23], sho:[1,18], knee:[-4,-6], ankle:[-7,-18] },
    trans: { pelvis:[0,16],  chest:[0,24], head:[0,31], sho:[0,27], knee:[4,4],   ankle:[1,-8] },
    top:   { pelvis:[0,30],  chest:[0,40], head:[0,48], sho:[0,42], knee:[0,16],  ankle:[0,2] },
    sad:   { pelvis:[0,-8],  chest:[-4,0], head:[-6,6], sho:[-5,2], knee:[7,-16], ankle:[11,-20] },
  };
  function lerpPose(a, b, t) { const o={}; for(const j of J) o[j]=[lerp(a[j][0],b[j][0],t),lerp(a[j][1],b[j][1],t)]; return o; }
  const smooth = (a,b,x)=>{ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };

  const s = {
    phase:"intro", t:0, time:0, reps:0, fails:0,
    progress:0, cursor:0.3, cvel:0, holding:false,
    target:0.3, wob:0, dart:0, dartTarget:0, dartT:0, climbT:0, flash:null,
    parts:[], sweatT:0, locked:false, failPose:null,
  };

  function hud() { setStat1(`<span class="n">${s.reps}</span> MUSCLE-UP`, { pop:true }); }
  function flash(text,color){ s.flash={text,color,t:0}; }
  function ringSway(){ return s.phase==="climb" && s.progress<0.62 ? Math.sin(s.time/240)*2.4*clamp(1-s.progress/0.62,0.2,1) : 0; }

  // ── 파티클 (땀·컨페티) ──
  function spawnSweat() {
    const hp = project(0, 18 + s.progress*22, 0);
    s.parts.push({ x:hp.sx+(Math.random()*2-1)*7, y:hp.sy-4, vx:(Math.random()*2-1)*0.7, vy:-0.9-Math.random()*0.7, g:0.05, t:0, life:650, col:"#bfe6ff" });
  }
  function spawnConfetti() {
    const cols=["#ffd23f","#e2513b","#43b047","#049cd8","#ff8ad0"];
    for (let i=0;i<26;i++) s.parts.push({ x:44+(Math.random()*2-1)*22, y:16+Math.random()*12, vx:(Math.random()*2-1)*1.5, vy:-1.6-Math.random()*1.6, g:0.06, t:0, life:1500, col:cols[i%5], sq:2 });
  }
  function updateParts(dt) {
    for (const p of s.parts) { p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.t+=dt; }
    s.parts = s.parts.filter(p => p.t<p.life && p.y<96);
  }
  function drawParts() { for (const p of s.parts) { const z=p.sq||1; px(p.x, p.y, z, z+(p.sq?0:1), p.col); } }

  function success() {
    s.reps++; flash("MUSCLE UP!", C.good); spawnConfetti();
    tone(440,660,0.1,0.35,"square"); setTimeout(()=>tone(660,880,0.12,0.35,"square"),110); setTimeout(()=>tone(880,1100,0.14,0.32,"square"),230);
    s.phase="success"; s.t=0; hud();
  }
  function fail() {
    s.fails++; flash("SLIPPED...", "#9a9aa2");
    tone(300,70,0.35,0.4,"sawtooth"); noise(0.16,0.4,400);
    s.failPose = climbPose();          // 떨어지기 직전 자세에서 벌러덩
    s.phase="fail"; s.t=0; s.locked=false;
  }
  function resetAttempt(){ s.phase="intro"; s.t=0; }

  // ── 포즈 선택 ──
  function climbPose() {
    let pose;
    if (s.progress < 0.5) {
      const sw = Math.sin(s.time/190);
      const kp = sw>0 ? P.kipF : P.kipB;
      const base = lerpPose(P.hang, kp, Math.abs(sw)*clamp(s.progress/0.4,0.3,1));   // 스윙 크게
      pose = lerpPose(base, P.trans, smooth(0.35,0.5,s.progress));
    } else {
      pose = lerpPose(P.trans, P.top, (s.progress-0.5)/0.5);
    }
    // 링에 매달려 펜듈럼처럼 흔들림 (하체가 크게)
    const sway = s.progress<0.62 ? Math.sin(s.time/240)*(3.5*clamp(1-s.progress/0.62,0,1)+0.6) : 0;
    pose.ankle[0]+=sway*1.5; pose.knee[0]+=sway*1.0; pose.pelvis[0]+=sway*0.5; pose.head[0]-=sway*0.3;
    const tr = s.progress>0.5 ? (s.progress-0.5)*1.3 : 0;   // 정상 근처 부들부들
    if (tr) for (const j of J) { pose[j][0]+=(Math.random()-.5)*tr*3.2; pose[j][1]+=(Math.random()-.5)*tr*3.2; }
    return pose;
  }
  function currentPose() {
    if (s.phase==="intro") {
      const ti=clamp(s.t/650,0,1);
      const pose=lerpPose(P.floor, P.hang, easeOut(ti));
      const jump=Math.sin(ti*Math.PI)*12;
      for (const j of J) pose[j][1]+=jump;
      return pose;
    }
    if (s.phase==="climb") return climbPose();
    if (s.phase==="success") { const pose=lerpPose(P.top,P.top,0); const hop=Math.abs(Math.sin(s.time/110))*6; for(const j of J) pose[j][1]+=hop; pose.head[0]+=Math.sin(s.time/90)*1.5; return pose; }
    if (s.phase==="fail") {
      const ti=clamp(s.t/520,0,1);                       // 링에서 벌러덩 → 축 처짐
      const pose=lerpPose(s.failPose||P.sad, P.sad, easeIn(ti));
      if (ti>=1) pose.head[0]+=Math.sin(s.time/400)*1.2;
      return pose;
    }
    return P.hang;
  }
  function armMode() {
    if (s.phase==="success") return "up";
    if (s.phase==="fail") return "hang";
    if (s.phase==="intro") return s.t>380 ? "rings" : "hang";
    return "rings";
  }
  function faceMood() { return s.phase==="success" ? "happy" : s.phase==="fail" ? "sad" : "tired"; }

  // ── 렌더 ──
  function drawRings() {
    for (const [rx,ry] of RING) {
      px(rx, 3, 1, ry-6, "#4a4a55");                 // 스트랩
      disc(rx, ry, 5, OUTLINE); disc(rx, ry, 3.4, "#40404c"); disc(rx, ry, 1.8, "#23232b");
    }
  }
  function face(pose, mood, L) {
    const h=pose.head, mo=mood;
    for (const sd of [-1,1]) {
      const ez=sd*3;
      blob(h[0]+1, h[1]+4, ez, 3, white, L);
      if (mo==="happy") { blob(h[0]+3, h[1]+4.6, ez, 1.5, pupil, L); }
      else {
        blob(h[0]+3, h[1]+3, ez, 1.3, pupil, L);
        blob(h[0]+1.4, h[1]+5.4, ez, 2.6, lid, L);
        blob(h[0]+2, h[1]+1.6, ez, 1.3, dark, L);
        if (mo==="sad") blob(h[0]+2.6, h[1]+0.6, ez, 1, [96,150,232], L);   // 눈물
      }
    }
    if (mo==="happy") { blob(h[0]+3.4, h[1]+1, 0, 1.4, [50,92,38], L); blob(h[0]+3.4, h[1]-0.4, 1.5, 1, [50,92,38], L); blob(h[0]+3.4, h[1]-0.4, -1.5, 1, [50,92,38], L); }
    else blob(h[0]+3.4, h[1]+0.2, 0, 1.2, [50,92,38], L);
  }
  function drawFrog() {
    const pose = currentPose(), mood = faceMood(), am = armMode();
    // 몸통/다리/머리 블롭
    const L=[];
    bone([pose.pelvis[0],pose.pelvis[1],0],[pose.chest[0],pose.chest[1],0],4,body,L);
    bone([pose.chest[0],pose.chest[1],0],[pose.head[0],pose.head[1],0],2.6,limb,L);
    blob(pose.head[0],pose.head[1],0,5,limb,L);
    for (const sd of [-1,1]) {
      const hip=[pose.pelvis[0],pose.pelvis[1],sd*HIPZ], knee=[pose.knee[0],pose.knee[1],sd*HIPZ], ank=[pose.ankle[0],pose.ankle[1],sd*HIPZ];
      bone(hip,knee,3.4,body,L); bone(knee,ank,2.8,limb,L); blob(ank[0]+1.2,ank[1]-1,ank[2],2.6,[70,74,90],L);
    }
    face(pose, mood, L);
    for (const b of L) { const p=project(b.x,b.y,b.z); b.sx=p.sx; b.sy=p.sy; b.depth=p.depth; b.sr=b.r*SC; }
    L.sort((a,b)=>a.depth-b.depth);
    for (const b of L) disc(b.sx,b.sy,b.sr+0.9,OUTLINE);
    for (const b of L) disc(b.sx,b.sy,b.sr, rgb(b.col, b.depth>0?1.0:0.86));
    // 팔 (스크린 공간)
    for (const sd of [-1,1]) {
      const sp=project(pose.sho[0],pose.sho[1],sd*SHOZ);
      let ex, ey;
      if (am==="rings") { const rg=RING[sp.sx < CX ? 0 : 1]; ex=rg[0]+ringSway(); ey=rg[1]; }   // 화면 기준 가까운 링(꼬임 방지)
      else if (am==="up") { ex=sp.sx+sd*5+Math.sin(s.time/110)*2; ey=sp.sy-11; }
      else { ex=sp.sx+sd*2; ey=sp.sy+13; }
      thickLine(sp.sx, sp.sy, ex, ey, 3, rgb(limb,1));
      disc(ex, ey, 2.4, rgb(limb,1));   // 손
    }
    // 춤 음표
    if (s.phase==="success") {
      const hp=project(pose.head[0],pose.head[1]+8,0);
      for (let i=0;i<2;i++){ const a=s.time/160+i*3.0; const nx=hp.sx+Math.cos(a)*10, ny=hp.sy-2+Math.sin(a)*4; px(nx,ny,2,2,"#ffd23f"); px(nx+2,ny-4,1,4,"#ffd23f"); }
    }
  }
  function drawTrack() {
    if (s.phase!=="climb" && s.phase!=="intro") return;
    const x=87, top=8, bot=88, h=bot-top;
    px(x-1, top, 5, h, "#191920");
    const TOL=D.tolBase - s.progress*D.tolK;
    const ty=bot - s.target*h;
    px(x+1, ty-TOL*h, 3, TOL*2*h, "#2a4a2a");          // 허용 밴드
    const pf=h*s.progress; px(x-1, bot-pf, 2, pf, C.good);   // 진행도
    px(x, ty-2, 5, 4, "#7ac846"); px(x+1,ty-1,1,1,"#111"); px(x+3,ty-1,1,1,"#111");  // 개구리 얼굴(타겟)
    const cy=bot - clamp(s.cursor,0,1)*h; px(x, cy, 5, 1, "#fff"); px(x,cy-1,1,3,"#fff");  // 커서
    if (s.locked) { px(x-3, ty-1, 2, 2, "#fff"); px(x+6, ty-1, 2, 2, "#fff"); }   // 락온 스파크
  }
  function drawFlash() {
    if (!s.flash) return; const p=s.flash.t/700; if(p>=1){s.flash=null;return;}
    ctx.globalAlpha=1-p*p; drawText(s.flash.text, 44, 11-p*5, 2, s.flash.color); ctx.globalAlpha=1;
  }

  return {
    shake: 0,
    enter() {
      s.phase="intro"; s.t=0; s.reps=0; s.fails=0; s.progress=0; s.cursor=0.3; s.cvel=0;
      s.holding=false; s.dart=0; s.dartTarget=0; s.dartT=0; s.flash=null;
      s.parts=[]; s.sweatT=0; s.locked=false; s.failPose=null;
      setHint("hold to pull up · chase the frog!"); hud();
    },
    onDown() { s.holding=true; },
    onMove() {},
    onUp() { s.holding=false; },
    update(dt) {
      s.time+=dt; s.t+=dt; const dts=dt/1000;
      if (s.flash) s.flash.t+=dt;
      updateParts(dt);
      if (s.phase==="intro") {
        if (s.t>680) { s.phase="climb"; s.t=0; s.progress=D.startProg; s.cursor=0.12+D.startProg*0.72; s.cvel=0; s.dart=0; s.climbT=0; setHint("chase the frog — don't let go!"); }
      } else if (s.phase==="climb") {
        // 타겟(도망가는 개구리 얼굴)
        const T=s.time/1000, amp=D.ampBase - s.progress*D.ampK, fr=D.frBase + s.progress*D.frK;
        s.dartT-=dt; if (s.dartT<=0){ s.dartTarget=(Math.random()*2-1)*D.dartAmp; s.dartT=D.dartMin+Math.random()*D.dartRange; }
        s.dart=lerp(s.dart, s.dartTarget, 1-Math.pow(0.004,dts));
        s.wob=Math.sin(T*fr)*amp + Math.sin(T*fr*1.7+1.3)*amp*0.45 + s.dart;
        s.target=clamp(0.12 + s.progress*0.72 + s.wob, 0.04, 0.98);
        // 커서 물리 (꾹=상승, 떼면=하강)
        const acc = s.holding ? D.accUp : -D.accDn;
        s.cvel += acc*dts; s.cvel *= Math.pow(0.05,dts);
        s.cursor += s.cvel*dts + (Math.random()-0.5)*0.006;
        s.cursor = clamp(s.cursor,0,1);
        // 진행도
        const d=Math.abs(s.cursor-s.target), TOL=D.tolBase - s.progress*D.tolK;
        const nowLocked = d<TOL;
        if (nowLocked && !s.locked) tone(300+s.progress*520, 0, 0.04, 0.1, "square");   // 락온 딸깍
        s.locked = nowLocked;
        if (nowLocked) s.progress += (D.fill + (1-d/TOL)*D.fillBonus)*dts;
        else s.progress -= D.drain*dts;
        s.progress -= D.endur*dts;
        s.climbT+=dt;
        // 땀방울 (정상 근처일수록 자주)
        s.sweatT-=dt; if (s.sweatT<=0) { spawnSweat(); s.sweatT = 240 - s.progress*150; }
        setStat2(`${clamp(s.progress*100,0,100)|0}%`);
        if (s.progress>=1) { s.progress=1; success(); }
        else if (s.progress<=0 && s.climbT>400) { s.progress=0; fail(); }
        else s.progress=clamp(s.progress,0,1);
      } else if (s.phase==="success") {
        setStat2(""); if (s.t>1900) resetAttempt();
      } else if (s.phase==="fail") {
        setStat2(""); if (s.t>1900) resetAttempt();
      }
    },
    render() {
      drawRings(); drawFrog(); drawParts(); drawTrack(); drawFlash();
    },
  };
}

// ═══════════════ 라우터 ═══════════════
const menuEl = document.getElementById("menu");
const stageEl = document.getElementById("stage");
const backEl = document.getElementById("back");
const GAMES = { combobag: makeComboBag(), unbroken: makeUnbroken(), rings: makeRingMuscleUp() };
let active = null;

function openGame(id) {
  active = GAMES[id];
  menuEl.style.display = "none"; stageEl.style.display = "block";
  backEl.style.display = "block";
  try { actx().resume(); } catch (e) {}
  active.enter();
}
function goMenu() {
  active = null; stageEl.style.display = "none"; stageEl.classList.remove("grab");
  menuEl.style.display = "flex"; backEl.style.display = "none";
  setHint(""); setStat1("FROG GYM", { title: true }); setStat2("");
}

document.querySelectorAll(".card[data-game]").forEach(c => c.addEventListener("click", () => openGame(c.dataset.game)));
backEl.addEventListener("click", (e) => { e.stopPropagation(); goMenu(); });
document.getElementById("close").addEventListener("click", (e) => {
  e.stopPropagation();
  if (window.__TAURI__) window.__TAURI__.window.getCurrentWindow().close();
});
stageEl.addEventListener("pointerdown", (e) => { if (active) active.onDown(e); });
window.addEventListener("pointermove", (e) => { if (active) active.onMove(e); });
window.addEventListener("pointerup", (e) => { if (active) active.onUp(e); });

// ═══════════════ 루프 ═══════════════
let lastT = performance.now();
function loop(now) {
  const dt = Math.min(48, now - lastT); lastT = now;
  ctx.clearRect(0, 0, W, H);
  if (active) {
    active.update(dt); active.render();
    const sh = active.shake || 0;
    const sx = sh ? (Math.random() - .5) * sh : 0, sy = sh ? (Math.random() - .5) * sh : 0;
    vctx.clearRect(0, 0, view.width, view.height);
    vctx.drawImage(buf, sx * SCALE, sy * SCALE, view.width, view.height);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

goMenu();
</script>
